<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 智能问答助手</title>
    <style>
        :root {
            --bg-color: #f7f7f8;
            --text-color: #333;
            --user-bubble: #007bff;
            --assistant-bubble: #ffffff;
            --border-color: #e5e5e5;
            --input-bg: #ffffff;
        }

        .dark-mode {
            --bg-color: #343541;
            --text-color: #d1d5db;
            --user-bubble: #21a1ff;
            --assistant-bubble: #40414f;
            --border-color: #4a4a5a;
            --input-bg: #40414f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: all 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .header button {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .header button:hover {
            background-color: var(--border-color);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            max-width: 80%;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user .message-bubble {
            background-color: var(--user-bubble);
            color: white;
        }

        .assistant .message-bubble {
            background-color: var(--assistant-bubble);
            border: 1px solid var(--border-color);
        }

        .loading .message-bubble {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-color);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-area {
            display: flex;
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-color);
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: var(--user-bubble);
        }

        .input-area button {
            margin-left: 12px;
            padding: 12px 24px;
            border: none;
            border-radius: 20px;
            background-color: var(--user-bubble);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .input-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>RAG 智能问答助手</h1>
        <div>
            <button id="clearBtn">清空对话</button>
            <button id="themeBtn">🌙 深色模式</button>
        </div>
    </div>

    <div class="chat-container" id="chatBox"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="请输入你的问题...">
        <button id="sendBtn">发送</button>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const themeBtn = document.getElementById('themeBtn');

        let isDarkMode = false;

        // 主题切换
        themeBtn.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode', isDarkMode);
            themeBtn.textContent = isDarkMode ? '☀️ 浅色模式' : '🌙 深色模式';
        });

        // 清空对话
        clearBtn.addEventListener('click', () => {
            chatBox.innerHTML = '';
        });

        // 发送消息
        async function sendMessage() {
            const question = userInput.value.trim();
            if (!question) return;

            // 1. 添加用户消息
            addMessage(question, 'user');
            userInput.value = '';
            sendBtn.disabled = true;

            // 2. 添加加载动画
            const loadingDiv = addLoadingMessage();

            try {
                // 3. 发送请求，流式接收数据
                const response = await fetch('/ask_stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, session_id: 'default' })
                });

                // 4. 移除加载动画，创建助手消息
                loadingDiv.remove();
                const assistantDiv = addMessage('', 'assistant');
                const assistantContent = assistantDiv.querySelector('.message-bubble');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);
                    fullText += chunk;
                    assistantContent.textContent = fullText;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }

                // ======================
                // 👇 在这里加来源解析逻辑
                // ======================
                let parts = fullText.split("###SOURCE###");
                let answer = parts[0] || "";
                let sources = parts.slice(1) || [];

                // 重新设置回答
                assistantContent.textContent = answer;

                // 如果有来源，追加显示灰色小字
                if (sources.length > 0 && sources[0].trim() !== "") {
                    let sourceHtml = `<div style="font-size:12px;color:#888;margin-top:8px;border-top:1px solid #eee;padding-top:6px;">`;
                    sourceHtml += `<strong>参考来源：</strong><br>`;
                    sources.forEach(s => {
                        if(s.trim()) sourceHtml += `• ${s}<br>`;
                    });
                    sourceHtml += `</div>`;
                    assistantContent.innerHTML += sourceHtml;
                }
            } catch (error) {
                loadingDiv.remove();
                addMessage(`请求出错：${error.message}`, 'assistant');
            } finally {
                sendBtn.disabled = false;
            }
        }

        function addMessage(text, role) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `<div class="message-bubble">${text}</div>`;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return messageDiv;
        }

        function addLoadingMessage() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant loading';
            messageDiv.innerHTML = `
                <div class="message-bubble">
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                </div>
            `;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return messageDiv;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
