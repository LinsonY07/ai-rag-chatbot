<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 智能问答助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 85vh;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 20px;
            background: #4e8af9;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #fbfcfe;
        }

        .message {
            margin-bottom: 16px;
            max-width: 75%;
            line-height: 1.5;
        }

        .user-message {
            margin-left: auto;
            background: #4e8af9;
            color: white;
            padding: 10px 14px;
            border-radius: 14px 14px 4px 14px;
        }

        .bot-message {
            margin-right: auto;
            background: #eaeef6;
            color: #333;
            padding: 10px 14px;
            border-radius: 14px 14px 14px 4px;
            white-space: pre-wrap;
        }

        .typing {
            font-style: italic;
            color: #666;
        }

        .chat-input {
            display: flex;
            padding: 12px;
            border-top: 1px solid #eee;
            background: white;
        }

        #question-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 24px;
            outline: none;
            font-size: 14px;
        }

        #question-input:focus {
            border-color: #4e8af9;
        }

        #send-btn {
            margin-left: 8px;
            padding: 12px 20px;
            background: #4e8af9;
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: bold;
        }

        #send-btn:disabled {
            background: #bbc3d6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">RAG 智能问答助手</div>
    <div class="chat-messages" id="message-container"></div>
    <div class="chat-input">
        <input type="text" id="question-input" placeholder="请输入你的问题..." autocomplete="off">
        <button id="send-btn">发送</button>
    </div>
</div>

<script>
    const messageContainer = document.getElementById('message-container');
    const questionInput = document.getElementById('question-input');
    const sendBtn = document.getElementById('send-btn');

    // 回车发送
    questionInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    sendBtn.addEventListener('click', sendMessage);

    async function sendMessage() {
        const question = questionInput.value.trim();
        if (!question) return;

        // 显示用户消息
        addMessage(question, 'user');
        questionInput.value = '';
        setLoading(true);

        // 显示AI正在输入
        const botMsgDiv = addMessage("正在思考...", "bot");
        botMsgDiv.classList.add('typing');

        try {
            const response = await fetch('http://127.0.0.1:8000/ask_stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question: question,
                    session_id: "user_123"
                })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            botMsgDiv.textContent = "";
            botMsgDiv.classList.remove('typing');

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const text = decoder.decode(value, { stream: true });
                botMsgDiv.textContent += text;
                scrollToBottom();
            }

        } catch (err) {
            botMsgDiv.textContent = "出错了：" + err.message;
        } finally {
            setLoading(false);
        }
    }

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = sender === 'user' ? 'message user-message' : 'message bot-message';
        div.textContent = text;
        messageContainer.appendChild(div);
        scrollToBottom();
        return div;
    }

    function setLoading(loading) {
        sendBtn.disabled = loading;
    }

    function scrollToBottom() {
        messageContainer.scrollTop = messageContainer.scrollHeight;
    }

    // 自动聚焦输入框
    window.onload = () => {
        questionInput.focus();
    };
</script>
</body>
</html>
