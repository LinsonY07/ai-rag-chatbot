<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 智能问答助手</title>
    <style>
        :root {
            --bg-color: #f7f7f8;
            --text-color: #333;
            --user-bubble: #007bff;
            --assistant-bubble: #ffffff;
            --border-color: #e5e5e5;
            --input-bg: #ffffff;
            --source-color: #666;
            --source-bg: #f5f7fa;
        }

        .dark-mode {
            --bg-color: #343541;
            --text-color: #d1d5db;
            --user-bubble: #21a1ff;
            --assistant-bubble: #40414f;
            --border-color: #4a4a5a;
            --input-bg: #40414f;
            --source-color: #b0b8c4;
            --source-bg: #2a2b32;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: all 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .header button {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .header button:hover {
            background-color: var(--border-color);
        }

        .page-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .file-manager {
            width: 260px;
            border-right: 1px solid var(--border-color);
            padding: 16px;
            overflow-y: auto;
            background: var(--bg-color);
        }

        .file-manager h3 {
            font-size: 16px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: var(--assistant-bubble);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .delete-btn {
            background: #dc3545;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .clear-all-btn {
            width: 100%;
            margin-top: 12px;
            padding: 8px;
            background: #fd7e14;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            max-width: 80%;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user .message-bubble {
            background-color: var(--user-bubble);
            color: white;
        }

        .assistant .message-bubble {
            background-color: var(--assistant-bubble);
            border: 1px solid var(--border-color);
        }

        .source-block {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
            font-size: 12px;
            color: var(--source-color);
            background: var(--source-bg);
            padding: 6px 10px;
            border-radius: 8px;
        }

        .loading .message-bubble {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-color);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-area {
            display: flex;
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-color);
            align-items: center;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: var(--user-bubble);
        }

        .input-area button {
            margin-left: 12px;
            padding: 12px 24px;
            border: none;
            border-radius: 20px;
            background-color: var(--user-bubble);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .input-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 上传进度条样式 */
        .progress-container {
            display: none;
            width: 100%;
            margin-top: 8px;
        }
        .progress-bar-bg {
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            height: 8px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #28a745;
            transition: width 0.2s ease;
        }
        .progress-text {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>RAG 智能问答助手</h1>
        <div>
            <button id="clearBtn">清空对话</button>
            <button id="themeBtn">🌙 深色模式</button>
        </div>
    </div>

    <div class="page-body">
        <div class="file-manager">
            <h3>📂 已上传文件</h3>
            <div id="fileList"></div>
            <button class="clear-all-btn" id="clearAllBtn">清空所有文件</button>
        </div>

        <div class="chat-container" id="chatBox"></div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="请输入你的问题...">
        
        <input type="file" id="fileInput" style="display: none;" accept=".txt,.md,.pdf,.docx,.xlsx">
        <button id="uploadBtn" style="background-color: #28a745;">上传文档</button>

        <!-- 进度条 -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar-bg">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <button id="sendBtn">发送</button>
    </div>

    <script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const themeBtn = document.getElementById('themeBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    let isDarkMode = false;

    function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0,
                v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    let sessionId = localStorage.getItem('rag_session_id');
    if (!sessionId) {
        sessionId = generateUUID();
        localStorage.setItem('rag_session_id', sessionId);
    }

    themeBtn.addEventListener('click', () => {
        isDarkMode = !isDarkMode;
        document.body.classList.toggle('dark-mode', isDarkMode);
        themeBtn.textContent = isDarkMode ? '☀️ 浅色模式' : '🌙 深色模式';
    });

    clearBtn.addEventListener('click', async () => {
        chatBox.innerHTML = '';
        try {
            await fetch('/clear_history', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId })
            });
            console.log("✅ 对话历史已清空");
        } catch (e) {
            console.log("清空失败", e);
        }
    });

    uploadBtn.addEventListener('click', () => {
        fileInput.click();
    });

    // 带进度条的上传
    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append("file", file);

        uploadBtn.disabled = true;
        uploadBtn.textContent = "上传中...";
        progressContainer.style.display = "block";
        progressBar.style.width = "0%";
        progressText.textContent = "0%";

        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/upload_doc");

        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 100);
                progressBar.style.width = percent + "%";
                progressText.textContent = percent + "%";
            }
        };

        xhr.onload = function() {
            if (xhr.status === 200) {
                const result = JSON.parse(xhr.responseText);
                alert(result.message);
                loadFileList();
            } else {
                alert("上传失败");
            }
            uploadBtn.disabled = false;
            uploadBtn.textContent = "上传文档";
            progressContainer.style.display = "none";
            fileInput.value = "";
        };

        xhr.onerror = function() {
            alert("上传失败：网络错误");
            uploadBtn.disabled = false;
            uploadBtn.textContent = "上传文档";
            progressContainer.style.display = "none";
            fileInput.value = "";
        };

        xhr.send(formData);
    });

    async function loadFileList() {
        const res = await fetch("/api/files");
        const data = await res.json();
        const listEl = document.getElementById("fileList");
        listEl.innerHTML = "";

        data.files.forEach(filename => {
            const item = document.createElement("div");
            item.className = "file-item";
            item.innerHTML = `
                <span>${filename}</span>
                <button class="delete-btn" onclick="deleteFile('${filename}')">删除</button>
            `;
            listEl.appendChild(item);
        });
    }

    async function deleteFile(filename) {
        if (!confirm(`确定删除 ${filename}？`)) return;
        await fetch(`/api/files/${filename}`, { method: "DELETE" });
        alert("已删除");
        loadFileList();
    }

    document.getElementById("clearAllBtn").addEventListener("click", async () => {
        if (!confirm("确定清空所有文件？不可恢复！")) return;
        await fetch("/api/files", { method: "DELETE" });
        alert("已清空所有文件");
        loadFileList();
    });

    window.onload = async function() {
        loadFileList();
        const res = await fetch("/api/history?session_id="+sessionId);
        const data = await res.json();
        data.history.forEach(h => addMessage(h.content, h.role));
    };

    async function sendMessage() {
        const question = userInput.value.trim();
        if (!question) return;

        addMessage(question, 'user');
        userInput.value = '';
        sendBtn.disabled = true;

        const loadingDiv = addLoadingMessage();

        try {
            const response = await fetch('/ask_stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question: question,
                    session_id: sessionId
                })
            });

            loadingDiv.remove();
            const assistantDiv = addMessage('', 'assistant');
            const assistantContent = assistantDiv.querySelector('.message-bubble');
            const decoder = new TextDecoder();
            const reader = response.body.getReader();
            let fullText = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                fullText += decoder.decode(value);
                assistantContent.textContent = fullText;
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            let parts = fullText.split("###SOURCE###");
            let answer = parts[0] || "";
            let sources = parts.slice(1) || [];

            assistantContent.textContent = answer;

            if (answer.includes("暂无相关信息，无法回答")) {
                return;
            }

            if (sources.length > 0 && sources[0].trim() !== "") {
                let sourceHtml = `<div class="source-block"><strong>📚 参考来源：</strong><br>`;
                sources.forEach(s => {
                    if (s.trim()) {
                        sourceHtml += `• ${s.trim()}<br>`;
                    }
                });
                sourceHtml += `</div>`;
                assistantContent.innerHTML += sourceHtml;
            }

        } catch (error) {
            loadingDiv.remove();
            addMessage(`请求出错：${error.message}`, 'assistant');
        } finally {
            sendBtn.disabled = false;
        }
    }

    // 带时间戳的消息
    function addMessage(text, role) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;
        
        const now = new Date();
        const time = `${now.getHours().toString().padStart(2,0)}:${now.getMinutes().toString().padStart(2,0)}`;
        
        messageDiv.innerHTML = `
            <div class="message-bubble">${text}</div>
            <div style="font-size:11px;color:#999;margin-top:4px;text-align:${role==='user'?'right':'left'}">
                ${time}
            </div>
        `;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return messageDiv;
    }

    function addLoadingMessage() {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message assistant loading';
        messageDiv.innerHTML = `
            <div class="message-bubble">
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
            </div>
        `;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return messageDiv;
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
    });
    </script>
</body>
</html>
