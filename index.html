<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>流式AI聊天</title>
    <style>
        body { max-width: 800px; margin: 0 auto; padding: 20px; }
        .message { margin: 10px 0; padding: 10px; border-radius: 8px; }
        .user { background: #007bff; color: white; text-align: right; }
        .ai { background: #e9e9eb; color: black; }
        #chat-box { height: 600px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
        #question { width: 700px; padding: 8px; }
        button { padding: 8px 16px; }
    </style>
</head>
<body>
    <div id="chat-box"></div>
    <input type="text" id="question" placeholder="输入问题...">
    <button onclick="sendMessage()">发送</button>

    <script>
        const sessionId = "user1";

        function appendMessage(text, sender) {
            const div = document.createElement("div");
            div.className = "message " + sender;
            div.textContent = text;
            document.getElementById("chat-box").appendChild(div);
        }

        async function sendMessage() {
            const input = document.getElementById("question");
            const question = input.value.trim();
            if (!question) return;

            // 追加用户消息
            appendMessage(question, "user");
            input.value = "";

            // 创建空的AI消息框，用于流式填充
            const chatBox = document.getElementById("chat-box");
            const aiMsg = document.createElement("div");
            aiMsg.className = "message ai";
            chatBox.appendChild(aiMsg);

            try {
                const res = await fetch("http://127.0.0.1:8000/ask_stream", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        question: question,
                        session_id: sessionId
                    })
                });

                // 流式读取核心代码
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    // 每收到一段文字就实时更新
                    const text = decoder.decode(value, { stream: true });
                    fullText += text;
                    aiMsg.textContent = fullText;

                    // 自动滚动到底部
                    chatBox.scrollTop = chatBox.scrollHeight;
                }

            } catch (e) {
                aiMsg.textContent = "连接失败：" + e.toString();
            }
        }
    </script>
</body>
</html>
